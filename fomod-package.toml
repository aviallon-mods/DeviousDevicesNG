# FOMOD package spec for Devious Devices NG (schema: aviallon-mods/modforge
# tools/package_fomod.py docstring). One [[files]] entry per zip entry: the zip
# contains exactly this list + meta.ini at its root, nothing else.
#
# `stage/` is produced by tools/fomod-stage.sh from a "Build and Release" run's
# artifacts (actions/download-artifact places them at artifacts/<name>/) plus
# this repo's tracked mod files. The staging script refuses to run when the
# staged tree carries a file this spec does not claim, so a file added to dist/
# or to the build outputs turns the packaging run red instead of silently
# missing from the zip.

name = "DeviousDevicesNG"
zip_name = "DeviousDevicesNG-{version}-fomod.zip"
# Single source of truth for the version: the project() line in CMakeLists.txt
# (same value the "Build and Release" archive name uses).
version = { cmake = "CMakeLists.txt" }
game_name = "skyrimspecialedition"
author = "IHateMyKite"
description = "NG implementation of DD's plugin."
nexus_name = "Devious Devices NG"
nexus_url = "https://github.com/aviallon-mods/DeviousDevicesNG"
file_category = "MAIN"
# Evidence: the shipped scripts import PapyrusUtil (zadLibs) and SexLab scripts
# (sslBaseExpression/sslUtility in zadexpressionlibs/zadBQ00) and extend SkyUI
# scripts (zadConfig extends SKI_ConfigBase, zadWidgets extends SKI_WidgetBase);
# the DLL is an SKSE plugin resolved through Address Library.
requirements = [
  "30379:SKSE64",
  "32444:Address Library for SKSE Plugins",
  "12604:SkyUI",
  "0:PapyrusUtil SE",
  "0:SexLab Framework",
]
fomod = true


